name: Test basic usage with subject-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact
        run: |
          echo "hello world" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/test-artifact.txt
          predicate-type: "https://example.com/predicate/v1"
          predicate: '{"buildType":"test","builder":{"id":"https://example.com/builder"}}'

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            echo "PASS: got bundle-path '$BUNDLE_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
