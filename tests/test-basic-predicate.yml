name: Test basic predicate attestation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create a sample artifact
        run: |
          echo "hello world" > /tmp/artifact.txt

      - name: Create predicate file
        run: |
          echo '{"buildType":"https://example.com/build","builder":{"id":"https://example.com/builder"}}' > /tmp/predicate.json

      - id: attest
        name: Run attestation action
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/artifact.txt
          subject-name: artifact.txt
          predicate-type: https://example.com/predicate/v1
          predicate-path: /tmp/predicate.json
          github-token: ${{ github.token }}

      - name: Assert action ran (may fail due to missing OIDC in act)
        env:
          OUTCOME: ${{ steps.attest.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # In act, OIDC token is unavailable so the action is expected to fail
          # We just verify it ran (success or failure) rather than being skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
