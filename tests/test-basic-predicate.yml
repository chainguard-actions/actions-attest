name: Test basic custom predicate attestation (no-OIDC error path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact
        run: |
          echo "hello world" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/test-artifact.txt
          predicate-type: https://example.com/predicate/v1
          predicate: '{"buildType":"test","builder":"act"}'
          show-summary: false
          github-token: ${{ github.token }}

      - name: Assert action ran (either succeeded or failed with expected error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          # Under act, OIDC is not available so the action will fail with
          # "missing id-token permission" — that is the expected behavior.
          # If it somehow succeeded (e.g. OIDC is available), verify bundle-path.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path is not set"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle file does not exist at $BUNDLE_PATH"
              exit 1
            fi
            echo "PASS: action succeeded and bundle file exists"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (OIDC not available under act)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
