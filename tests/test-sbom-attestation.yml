name: Test SBOM attestation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create subject artifact
        run: |
          echo "my-binary-content" > /tmp/my-binary.bin

      - name: Create SPDX SBOM file
        run: |
          cat > /tmp/sbom.spdx.json <<'EOF'
          {
            "SPDXID": "SPDXRef-DOCUMENT",
            "spdxVersion": "SPDX-2.3",
            "creationInfo": {
              "created": "2024-01-01T00:00:00Z",
              "creators": ["Tool: test-tool-1.0"]
            },
            "name": "test-sbom",
            "dataLicense": "CC0-1.0",
            "documentNamespace": "https://example.com/test-sbom",
            "packages": []
          }
          EOF

      - id: action
        uses: .
        with:
          subject-path: /tmp/my-binary.bin
          sbom-path: /tmp/sbom.spdx.json
          show-summary: false
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (may fail due to API limitations in act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # In act, this action will fail because it cannot reach the GitHub API
          # or sign with Sigstore. We accept 'failure' as a valid outcome here,
          # but we must not see a configuration/input-parsing error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
