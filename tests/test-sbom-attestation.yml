name: Test SBOM attestation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact and SBOM files
        run: |
          echo "my-binary-content" > /tmp/my-binary.bin
          cat > /tmp/sbom.json << 'EOF'
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "version": 1,
            "metadata": {
              "timestamp": "2024-01-01T00:00:00Z",
              "component": {
                "type": "application",
                "name": "my-app",
                "version": "1.0.0"
              }
            },
            "components": []
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-path: "/tmp/my-binary.bin"
          sbom-path: "/tmp/sbom.json"
          show-summary: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.action.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.action.outputs.attestation-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          echo "attestation-id: $ATTESTATION_ID"
          echo "attestation-url: $ATTESTATION_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle-path '$BUNDLE_PATH' does not exist on disk"
              exit 1
            fi
            echo "PASS: SBOM attestation created, bundle-path=$BUNDLE_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
