name: Test SBOM attestation input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact and SBOM file
        run: |
          echo "hello world" > /tmp/artifact.txt
          cat > /tmp/sbom.json << 'EOF'
          {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "SPDXID": "SPDXRef-DOCUMENT",
            "name": "test-sbom",
            "documentNamespace": "https://example.com/test-sbom",
            "packages": []
          }
          EOF

      - name: Run attestation action with SBOM (expect failure due to missing OIDC in act)
        id: action
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/artifact.txt
          subject-name: artifact.txt
          sbom-path: /tmp/sbom.json
          github-token: fake-token-for-testing
          show-summary: false

      - name: Assert action ran (not input validation failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of missing OIDC/API access, not because of bad inputs
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with sbom-path input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
