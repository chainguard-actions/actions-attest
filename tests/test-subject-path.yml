name: Test attestation with subject-path and predicate-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact and predicate files
        run: |
          echo "hello world artifact" > /tmp/test-artifact.txt
          cat > /tmp/test-predicate.json << 'EOF'
          {
            "buildType": "https://example.com/build/v1",
            "builder": {
              "id": "https://example.com/builder/v1"
            },
            "invocation": {
              "configSource": {}
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-path: "/tmp/test-artifact.txt"
          predicate-type: "https://example.com/build/v1"
          predicate-path: "/tmp/test-predicate.json"
          show-summary: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.action.outputs.attestation-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          echo "attestation-id: $ATTESTATION_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle-path '$BUNDLE_PATH' does not exist on disk"
              exit 1
            fi
            echo "PASS: attestation created, bundle-path=$BUNDLE_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
