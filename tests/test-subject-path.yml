name: Test subject-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact file
        run: |
          echo "hello world" > /tmp/artifact.txt

      - name: Run attestation action (expect failure due to missing OIDC in act)
        id: action
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/artifact.txt
          subject-name: artifact.txt
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          github-token: fake-token-for-testing
          show-summary: false

      - name: Assert action ran and failed with expected error (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of missing OIDC/API access, not because of bad inputs
          # We accept either 'success' (unlikely in act) or 'failure' (expected due to no OIDC)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with subject-path input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
