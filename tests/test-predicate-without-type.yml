name: Test predicate without predicate-type error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact file
        run: echo "test artifact content" > /tmp/test-artifact.txt

      - name: Run action with predicate but no predicate-type (expect failure)
        id: action
        uses: .
        with:
          subject-path: /tmp/test-artifact.txt
          predicate: '{"key":"value"}'
        continue-on-error: true

      - name: Assert action failed due to missing predicate-type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when predicate was provided without predicate-type"
