name: Test attestation with subject-checksums
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create checksums file
        run: |
          # Create a checksums file in sha256sum format: "<digest>  <name>"
          cat > /tmp/checksums.txt << 'EOF'
          a948904f2f0f479b8f936065a3e9d9c4b0e7e8f1e3f4e5f6a7b8c9d0e1f2a3b4  artifact-one.tar.gz
          EOF
          echo "Created checksums file at /tmp/checksums.txt"
          cat /tmp/checksums.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-checksums: "/tmp/checksums.txt"
          predicate-type: "https://example.com/test/v1"
          predicate: '{"test": true, "scenario": "checksums"}'
          push-to-registry: false
          show-summary: false
          github-token: ${{ github.token }}

      - name: Assert action ran (either succeeded or failed with expected error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          # Under act, OIDC tokens are not available so the action will fail
          # with a missing id-token permission error. This is expected behavior.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded - verifying outputs"
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path is empty"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle file does not exist at $BUNDLE_PATH"
              exit 1
            fi
            echo "PASS: action succeeded with bundle at $BUNDLE_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (OIDC not available under act)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
