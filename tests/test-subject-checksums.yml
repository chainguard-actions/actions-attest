name: Test subject-checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a checksums file
        run: |
          echo "abc123def456abc123def456abc123def456abc123def456abc123def456abc123  artifact.bin" > /tmp/checksums.txt
          cat /tmp/checksums.txt

      - name: Run action with subject-checksums input (expect failure at OIDC stage)
        id: action
        uses: .
        with:
          subject-checksums: /tmp/checksums.txt
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
        continue-on-error: true

      - name: Assert action failed (OIDC not available in test environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no OIDC token available) but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when subject-checksums was provided without OIDC"
