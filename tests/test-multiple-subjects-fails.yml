name: Test providing multiple subject inputs causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create a sample artifact
        run: |
          echo "hello world" > /tmp/artifact.txt

      - id: attest
        name: Run attestation action with both subject-path and subject-digest
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/artifact.txt
          subject-digest: sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          subject-name: artifact.txt
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          github-token: ${{ github.token }}

      - name: Assert action failed due to multiple subject inputs
        env:
          OUTCOME: ${{ steps.attest.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when multiple subject inputs are provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when multiple subject inputs were provided"
