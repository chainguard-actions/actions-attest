name: Test subject-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          subject-digest: "sha256:a948904f2f0f479b8f936065f3e9d7c5b9b8b8b8b8b8b8b8b8b8b8b8b8b8b8b"
          subject-name: "my-artifact"
          subject-version: "1.2.3"
          predicate-type: "https://example.com/predicate/v1"
          predicate: '{"key":"value"}'
          push-to-registry: "false"
          show-summary: "false"
          github-token: ${{ github.token }}

      - name: Assert bundle-path output is set
        env:
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "bundle-path: $BUNDLE_PATH"
          if [ -z "$BUNDLE_PATH" ]; then
            echo "FAIL: expected bundle-path to be set"
            exit 1
          fi
          echo "PASS: bundle-path is set"

      - name: Assert attestation-id output is set
        env:
          ATTESTATION_ID: ${{ steps.action.outputs.attestation-id }}
        run: |
          echo "attestation-id: $ATTESTATION_ID"
          if [ -z "$ATTESTATION_ID" ]; then
            echo "FAIL: expected attestation-id to be set"
            exit 1
          fi
          echo "PASS: attestation-id is set"
