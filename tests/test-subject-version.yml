name: Test subject-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Run action with subject-version input
        id: attest
        continue-on-error: true
        uses: .
        with:
          subject-digest: sha256:a948904f2f0f479b8f936b4a4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e
          subject-name: ghcr.io/example/test-image
          subject-version: "1.2.3"
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          push-to-registry: true
          create-storage-record: true
          github-token: fake-token-for-testing

      - name: Assert action accepted subject-version input
        env:
          OUTCOME: ${{ steps.attest.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to API/token or registry issues, not input validation.
          # We accept either 'success' or 'failure' — the key is that subject-version was accepted.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted subject-version input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
