name: Test subject-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          subject-name: my-artifact
          subject-version: v1.2.3
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          push-to-registry: false
          create-storage-record: false
          github-token: ${{ github.token }}

      - name: Assert action ran (may fail due to missing OIDC token in act)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached"
