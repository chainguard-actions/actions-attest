name: Test subject-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with subject-version input (expect failure at OIDC/registry stage)
        id: action
        uses: .
        with:
          subject-digest: sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc123
          subject-name: example-artifact
          subject-version: 1.2.3
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          push-to-registry: true
          create-storage-record: true
        continue-on-error: true

      - name: Assert action failed (OIDC not available in test environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no OIDC token / registry access) but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when subject-version was provided without OIDC/registry access"
