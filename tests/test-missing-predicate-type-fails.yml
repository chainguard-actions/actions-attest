name: Test missing predicate-type with predicate causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create a sample artifact
        run: |
          echo "hello world" > /tmp/artifact.txt

      - id: attest
        name: Run attestation action with predicate but no predicate-type
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/artifact.txt
          subject-name: artifact.txt
          predicate: '{"key":"value"}'
          github-token: ${{ github.token }}

      - name: Assert action failed due to missing predicate-type
        env:
          OUTCOME: ${{ steps.attest.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when predicate-type is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when predicate-type was missing"
