name: Test predicate-type and predicate inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          subject-name: my-artifact
          predicate-type: https://example.com/custom-predicate/v1
          predicate: '{"buildType":"local","builder":{"id":"local"}}'
          show-summary: false
          github-token: fake-token-for-coverage

      - name: Assert action was attempted
        run: |
          echo "Action step completed (may have errored due to missing credentials)"
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: predicate-type and predicate inputs were exercised"
