name: Test invalid subject-digest format error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid subject-digest format (expect failure)
        id: action
        uses: .
        with:
          subject-digest: not-a-valid-digest-format
          subject-name: my-artifact
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
        continue-on-error: true

      - name: Assert action failed due to invalid digest format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when subject-digest had an invalid format"
