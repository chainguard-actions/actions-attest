name: Test usage with subject-digest and subject-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          subject-name: my-artifact
          predicate-type: https://example.com/predicate/v1
          predicate: '{"buildType":"test","builder":{"id":"https://example.com/builder"}}'
          show-summary: false

      - name: Assert action ran and produced expected outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle-path '$BUNDLE_PATH' does not exist on disk"
              exit 1
            fi
            echo "PASS: attestation bundle created at $BUNDLE_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for attestation API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
