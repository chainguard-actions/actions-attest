name: Test subject-digest with subject-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute digest of a file
        id: digest
        run: |
          echo "test artifact content" > /tmp/artifact.bin
          DIGEST="sha256:$(sha256sum /tmp/artifact.bin | awk '{print $1}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Computed digest: $DIGEST"

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: my-artifact
          predicate-type: "https://slsa.dev/provenance/v1"
          predicate: '{"buildDefinition":{"buildType":"https://example.com/build"},"runDetails":{"builder":{"id":"https://example.com/builder"}}}'
          github-token: ${{ github.token }}

      - name: Assert action ran and produced expected outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle-path '$BUNDLE_PATH' does not point to an existing file"
              exit 1
            fi
            echo "PASS: action succeeded and bundle-path is set to '$BUNDLE_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo - attestation API not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
