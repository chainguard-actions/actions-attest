name: Test subject-digest input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run attestation action with subject-digest (expect failure due to missing OIDC in act)
        id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          subject-name: my-artifact
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          github-token: fake-token-for-testing
          show-summary: false

      - name: Assert action ran (not input validation failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of missing OIDC/API access, not because of bad inputs
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with subject-digest input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
