name: Test attestation with subject-digest (no-OIDC error path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute digest of a test artifact
        id: digest
        run: |
          echo "hello attestation" > /tmp/digest-artifact.txt
          DIGEST="sha256:$(sha256sum /tmp/digest-artifact.txt | awk '{print $1}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Computed digest: $DIGEST"

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: my-test-artifact
          predicate-type: https://example.com/predicate/v1
          predicate: '{"buildType":"digest-test","builder":"act"}'
          show-summary: false
          github-token: ${{ github.token }}

      - name: Assert action ran (either succeeded or failed with expected error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.action.outputs.attestation-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          echo "attestation-id: $ATTESTATION_ID"
          # Under act, OIDC is not available so the action will fail with
          # "missing id-token permission" — that is the expected behavior.
          # If it somehow succeeded (e.g. OIDC is available), verify outputs.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path is not set"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle file does not exist at $BUNDLE_PATH"
              exit 1
            fi
            echo "Bundle contents (first 500 chars):"
            head -c 500 "$BUNDLE_PATH"
            echo ""
            echo "PASS: action succeeded and bundle file exists"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (OIDC not available under act)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
