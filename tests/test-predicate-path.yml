name: Test usage with predicate-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact and predicate file
        run: |
          echo "artifact content" > /tmp/test-artifact.txt
          cat > /tmp/predicate.json << 'EOF'
          {
            "buildType": "https://example.com/build/v1",
            "builder": {
              "id": "https://example.com/builder/v1"
            },
            "invocation": {
              "configSource": {}
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/test-artifact.txt
          predicate-type: https://slsa.dev/provenance/v0.2
          predicate-path: /tmp/predicate.json
          show-summary: false

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            echo "PASS: got bundle-path '$BUNDLE_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
