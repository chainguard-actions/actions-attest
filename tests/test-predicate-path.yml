name: Test predicate-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a predicate file
        run: |
          cat > /tmp/predicate.json << 'EOF'
          {
            "buildType": "https://example.com/build/v1",
            "builder": {
              "id": "https://example.com/builder/v1"
            },
            "invocation": {
              "configSource": {}
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          subject-name: my-artifact
          predicate-type: https://example.com/custom-predicate/v1
          predicate-path: /tmp/predicate.json
          show-summary: false
          github-token: fake-token-for-coverage

      - name: Assert action was attempted
        run: |
          echo "Action step completed (may have errored due to missing credentials)"
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: predicate-path input was exercised"
