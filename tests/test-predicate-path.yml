name: Test predicate-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact and predicate files
        run: |
          echo "hello world" > /tmp/artifact.txt
          cat > /tmp/predicate.json << 'EOF'
          {
            "builder": {
              "id": "https://example.com/builder"
            },
            "buildType": "https://example.com/build/v1",
            "invocation": {}
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-path: /tmp/artifact.txt
          predicate-type: https://example.com/custom-predicate/v1
          predicate-path: /tmp/predicate.json
          show-summary: false
          github-token: ${{ github.token }}

      - name: Assert action ran (may fail due to missing OIDC token in act)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached"
