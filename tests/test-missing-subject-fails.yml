name: Test missing subject input causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - id: attest
        name: Run attestation action without any subject input
        uses: .
        continue-on-error: true
        with:
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          github-token: ${{ github.token }}

      - name: Assert action failed due to missing subject
        env:
          OUTCOME: ${{ steps.attest.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no subject is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no subject input was provided"
