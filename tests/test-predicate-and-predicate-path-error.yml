name: Test predicate and predicate-path mutual exclusion error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact file and predicate file
        run: |
          echo "test artifact content" > /tmp/test-artifact.txt
          echo '{"key":"value"}' > /tmp/predicate.json

      - name: Run action with both predicate and predicate-path (expect failure)
        id: action
        uses: .
        with:
          subject-path: /tmp/test-artifact.txt
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          predicate-path: /tmp/predicate.json
        continue-on-error: true

      - name: Assert action failed due to mutual exclusion of predicate inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when both predicate and predicate-path were provided"
