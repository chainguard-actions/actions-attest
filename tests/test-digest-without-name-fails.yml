name: Test subject-digest without subject-name causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - id: attest
        name: Run attestation action with subject-digest but no subject-name
        uses: .
        continue-on-error: true
        with:
          subject-digest: sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          predicate-type: https://example.com/predicate/v1
          predicate: '{"key":"value"}'
          github-token: ${{ github.token }}

      - name: Assert action failed due to missing subject-name
        env:
          OUTCOME: ${{ steps.attest.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when subject-digest is provided without subject-name, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when subject-name was missing alongside subject-digest"
